name: Pull Request Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Lint Check
        run: ./gradlew lint
        
      - name: Build Debug APKs
        run: ./gradlew assembleDebug
        
      - name: Run Unit Tests
        run: ./gradlew test
        
      - name: Comment PR with Build Status
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const { context } = require('@actions/github');
            const buildStatus = '${{ job.status }}';
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;
            
            let message;
            if (buildStatus === 'success') {
              message = `✅ **Build Successful!**
              
              All checks passed:
              - ✅ Lint check
              - ✅ Debug build
              - ✅ Unit tests
              
              [View details](${runUrl})`;
            } else {
              message = `❌ **Build Failed!**
              
              Some checks failed. Please check the logs for details.
              
              [View details](${runUrl})`;
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
            
      - name: Make gradlew executable
        run: chmod +x ./gradlew
        
      - name: Run Detekt (if available)
        run: |
          if ./gradlew tasks --all | grep -q "detekt"; then
            ./gradlew detekt
          else
            echo "Detekt not configured, skipping..."
          fi
        continue-on-error: true
        
      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for TODO/FIXME comments..."
          TODO_COUNT=$(find app/src -name "*.kt" -exec grep -l "TODO\|FIXME" {} \; | wc -l)
          if [ $TODO_COUNT -gt 0 ]; then
            echo "Found $TODO_COUNT files with TODO/FIXME comments:"
            find app/src -name "*.kt" -exec grep -Hn "TODO\|FIXME" {} \;
            echo "::warning::Found $TODO_COUNT files with TODO/FIXME comments"
          else
            echo "No TODO/FIXME comments found"
          fi