name: Android Release Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest

    strategy:
      matrix:
        variant: [ over30Release, under29Release ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK
        run: ./gradlew assemble${{ matrix.variant }}

      - name: Extract APK Path and Info
        id: extract_apk_info
        run: |
          APK_PATH=$(find app/build/outputs/apk -name '*.apk' -type f | head -1)
          APK_NAME="minimalist-${{ matrix.variant }}-${{ github.ref_name }}.apk"
          echo "apk_path=${APK_PATH}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "variant_lower=$(echo ${{ matrix.variant }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-apk
          path: ${{ steps.extract_apk_info.outputs.apk_path }}
          retention-days: 30

      - name: Upload APK to Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.extract_apk_info.outputs.apk_path }}
          name: ${{ steps.extract_apk_info.outputs.apk_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload to GitHub Packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          # GitHub Packagesへのアップロード
          echo "Uploading ${{ steps.extract_apk_info.outputs.apk_name }} to GitHub Packages..."
          
          # Maven repository setup for GitHub Packages
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          
          # Create package structure
          PACKAGE_GROUP="jp.bizen.app"
          PACKAGE_NAME="minimalist"
          VERSION="${{ github.ref_name }}"
          VARIANT="${{ steps.extract_apk_info.outputs.variant_lower }}"
          
          # Upload using curl to GitHub Packages
          curl -X PUT \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @${{ steps.extract_apk_info.outputs.apk_path }} \
            "https://maven.pkg.github.com/${{ github.repository }}/${PACKAGE_GROUP}/${PACKAGE_NAME}/${VERSION}/${PACKAGE_NAME}-${VERSION}-${VARIANT}.apk"

  update-readme:
    name: Update README with QR Codes
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Generate QR Codes and Update README
        run: |
          # Download all APK artifacts
          VERSION="${{ github.ref_name }}"
          
          # Generate QR codes for both variants
          OVER30_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/minimalist-over30Release-${VERSION}.apk"
          UNDER29_URL="https://github.com/${{ github.repository }}/releases/download/${VERSION}/minimalist-under29Release-${VERSION}.apk"
          
          OVER30_QR="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${OVER30_URL}"
          UNDER29_QR="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${UNDER29_URL}"
          
          # Update README.md
          cat > temp_readme.md << EOF
          # Minimalist - Android App Manager
          
          A minimalist Android application manager that helps you uninstall unwanted apps.
          
          ## Download
          
          ### For Android 11+ (API 30+)
          ![QR Code for over30Release](${OVER30_QR})
          
          [Download APK](${OVER30_URL})
          
          ### For Android 10 and below (API 29-)
          ![QR Code for under29Release](${UNDER29_QR})
          
          [Download APK](${UNDER29_URL})
          
          ## Features
          
          - List all installed applications
          - Filter by system/user apps
          - Uninstall unwanted applications
          - Minimalist design
          - Support for different Android versions
          
          ## Build Information
          
          - **Latest Version**: ${VERSION}
          - **Package Name**: jp.bizen.app.minimalist
          - **Built with**: Java 21, Kotlin
          
          ---
          
          *Last updated: $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF
          
          # Replace README.md
          mv temp_readme.md README.md

      - name: Create Pull Request for README Update
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "docs: update README with QR codes for release ${{ github.ref_name }}"
          branch: update-readme-${{ github.ref_name }}
          title: "📱 Update README with QR codes for release ${{ github.ref_name }}"
          body: |
            ## Summary
            Auto-generated update of README.md with QR codes for the new release.
            
            ## Changes
            - ✅ Updated QR codes for both APK variants
            - ✅ Updated download links
            - ✅ Updated version information
            - ✅ Updated last modified timestamp
            
            ## Release Information
            - **Version**: ${{ github.ref_name }}
            - **over30Release APK**: Available for Android 11+
            - **under29Release APK**: Available for Android 10 and below
            
            🤖 Auto-generated by GitHub Actions
          labels: |
            documentation
            release
            auto-update
          base: develop
          delete-branch: true